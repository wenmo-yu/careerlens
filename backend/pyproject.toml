[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careerlens-backend"
version = "0.4.0"
description = "Evidence-first backend for the CareerLens career copilot"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "mcp>=2,<3",
  "pydantic-settings>=2.6,<3",
  "prometheus-client>=0.21,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "qdrant-client>=1.15.1,<1.21",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  # 9.0.3 fixes PYSEC-2026-1845 (world-writable tmp dir on UNIX).
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]
ml = [
  "sentence-transformers>=5,<6",
  "transformers>=4.51,<6",
]
multimodal = [
  "av>=18.1.1,!=19.0.1,<20",
  "faster-whisper>=1.2,<2",
  "numpy>=2.1,<3",
  "paddleocr>=3,<4",
  "paddlepaddle>=3,<4",
  "pillow>=11,<13",
]
observability = [
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "opentelemetry-sdk>=1.38,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
# Migrations are exercised by tests/test_migrations.py but their bodies are
# declarative; counting them would inflate the number without adding signal.
# sandbox.py is Windows-only: on Linux nearly every branch is unreachable, so it
# would drag the floor down without measuring anything. It is covered by
# tests/test_sandbox.py in the Windows CI job and by the T14/T16 probe.
omit = ["app/evaluation/cli.py", "app/runtime/sandbox.py"]

[tool.coverage.report]
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

