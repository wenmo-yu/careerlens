services:
  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "app.migration_runner"]
    environment:
      DATABASE_URL: postgresql+asyncpg://career:career@postgres:5432/career
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://career:career@postgres:5432/career
      AUTO_CREATE_SCHEMA: "false"
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      QDRANT_URL: http://qdrant:6333
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-auto}
      RETRIEVAL_PROVIDER: ${RETRIEVAL_PROVIDER:-hash}
      CHECKPOINT_BACKEND: postgres
      CHECKPOINT_DATABASE_URL: postgresql://career:career@postgres:5432/career
      LANGGRAPH_STRICT_MSGPACK: "true"
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_INPUT_PRICE_PER_MILLION: ${AI_INPUT_PRICE_PER_MILLION:-0}
      AI_OUTPUT_PRICE_PER_MILLION: ${AI_OUTPUT_PRICE_PER_MILLION:-0}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:-careerlens-compose-development-only}
      AUTH_REGISTRATION_SECRET: ${AUTH_REGISTRATION_SECRET:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-careerlens-api}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://host.docker.internal:4318/v1/traces}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-careerlens-local}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mcp:
    build:
      context: ./backend
    command:
      - python
      - -m
      - app.mcp.server
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://career:career@postgres:5432/career
      QDRANT_URL: http://qdrant:6333
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-auto}
      RETRIEVAL_PROVIDER: ${RETRIEVAL_PROVIDER:-hash}
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_INPUT_PRICE_PER_MILLION: ${AI_INPUT_PRICE_PER_MILLION:-0}
      AI_OUTPUT_PRICE_PER_MILLION: ${AI_OUTPUT_PRICE_PER_MILLION:-0}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:-careerlens-compose-development-only}
      MCP_AUTH_MODE: required
      MCP_AUTH_ISSUER_URL: http://localhost:8000
      MCP_RESOURCE_SERVER_URL: http://localhost:8001/mcp
    ports:
      - "8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8001),5); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: career
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      # Keep the standard ports inside the Compose network, but avoid
      # colliding with a developer's already-running local Qdrant instance.
      - "${QDRANT_HTTP_PORT:-16333}:6333"
      - "${QDRANT_GRPC_PORT:-16334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:

