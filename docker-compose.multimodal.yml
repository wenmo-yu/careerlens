services:
  api: &media
    build:
      args:
        INSTALL_MULTIMODAL: "true"
    environment:
      MEDIA_PROVIDER: auto
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      OCR_LANGUAGE: ch
    volumes:
      - media_model_cache:/root/.cache
  worker:
    <<: *media
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /root/.cache
      PADDLE_PDX_CACHE_HOME: /root/.cache/paddlex
      MEDIA_PROVIDER: auto
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      OCR_LANGUAGE: ch

volumes:
  media_model_cache:
