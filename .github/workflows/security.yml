name: Dependency Audit

# Separate from the quality gate on purpose: a newly disclosed CVE should make
# this workflow red the day it lands, without blocking every unrelated pull
# request in the repository.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/pyproject.toml"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Audit the tool used to install, too: an old pip is itself a finding.
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./backend[dev]" pip-audit
      - name: Audit installed Python packages
        # --skip-editable excludes this project itself; --strict would treat that
        # skip as an error, so plain audit is what we want.
        run: pip-audit --desc --skip-editable

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
