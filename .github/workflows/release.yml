name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vMAJOR.MINOR.PATCH release tag" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PY' > release-notes.md
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## {re.escape(version)}\b.*$", re.MULTILINE)
          match = heading.search(text)
          if not match:
              raise SystemExit(f"No changelog entry found for {version}")
          start = match.end()
          next_section = re.search(r"^## ", text[start:], re.MULTILINE)
          end = start + next_section.start() if next_section else len(text)
          section = text[start:end].strip()
          print(f"CareerLens {version}")
          print()
          print(section)
          PY
          echo " notes extracted: $(wc -l < release-notes.md) lines"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "CareerLens $TAG" \
            --notes-file release-notes.md \
            --verify-tag
