name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Run frozen regression gate
        run: >-
          python -m app.evaluation.cli
          --dataset app/evaluation/dev_benchmark_v3.json
          --baseline ../eval/baselines/careerlens-dev-benchmark-v3.json

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Test browser helper capture and collection
        run: |
          node ../browser-helper/test-capture.mjs
          node ../browser-helper/test-collection.mjs
          node --check ../browser-helper/popup.js
      - run: pnpm build

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: docker compose up -d --build
      - name: Run disposable end-to-end smoke test
        shell: pwsh
        run: ./scripts/docker-smoke.ps1
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
