name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check --config pyproject.toml . ../examples/tutorials
      - name: Run the test suite with a coverage floor
        run: pytest --cov --cov-report=term-missing --cov-fail-under=78
      - name: Run offline RRF tutorial exercise with default and custom rankings
        working-directory: .
        run: |
          python3 examples/tutorials/lesson-05-rrf/main.py
          python3 examples/tutorials/lesson-05-rrf/main.py --k 10
          python3 examples/tutorials/lesson-05-rrf/main.py --drop-b
          python3 examples/tutorials/lesson-05-rrf/main.py --rankings "A,X,Y,B" "C,U,V,B"
      - name: Run evaluation tutorial exercise (Recall@2 demo)
        working-directory: .
        run: python3 examples/tutorials/lesson-06-eval/main.py
      - name: Run frozen regression gate
        run: >-
          python -m app.evaluation.cli
          --dataset app/evaluation/dev_benchmark_v3.json
          --baseline ../eval/baselines/careerlens-dev-benchmark-v3.json

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Test frontend pure functions and stream parsing
        run: pnpm test
      - name: Test browser helper capture and collection
        run: |
          node ../browser-helper/test-capture.mjs
          node ../browser-helper/test-collection.mjs
          node --check ../browser-helper/popup.js
      - run: pnpm build

  agent-runtime-m0:
    name: Agent Core M0 prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run self-developed Runner and JSONL protocol tests
        run: node --test agent-runtime/tests/*.test.ts

  daemon-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run daemon tests on Windows
        run: >
          pytest -q
          tests/test_daemon_contract.py
          tests/test_daemon_supervisor.py
          tests/test_daemon_control.py
          tests/test_daemon_lifecycle.py
          tests/test_daemon_windows.py

  agent-runtime-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run agent plane tests on Windows
        run: >-
          pytest -q
          tests/test_agent_store.py
          tests/test_agent_pool.py
          tests/test_agent_gateway.py
          tests/test_agent_api.py
          tests/test_agent_scheduler.py
          tests/test_agent_cli.py

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same stack the Docker smoke test uses, but without containers: the goal
      # here is to drive the browser, not to prove the image builds.
      DATABASE_URL: sqlite+aiosqlite:///./e2e.db
      RETRIEVAL_BACKEND: local
      CHECKPOINT_BACKEND: memory
      AI_PROVIDER: demo
      AUTO_CREATE_SCHEMA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pip install -e "./backend[dev]"
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - name: Start API, worker and web, then run the browser suite
        run: |
          set -euo pipefail
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &)
          (cd backend && python -m app.runtime.worker > /tmp/worker.log 2>&1 &)
          (cd frontend && pnpm start > /tmp/web.log 2>&1 &)
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/health/live > /dev/null \
              && curl -sf http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health/live > /dev/null
          curl -sf http://127.0.0.1:3000/ > /dev/null
          (cd frontend && pnpm exec playwright test)
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== api ===" && tail -200 /tmp/api.log || true
          echo "=== worker ===" && tail -200 /tmp/worker.log || true
          echo "=== web ===" && tail -200 /tmp/web.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify merged production Compose security baseline
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          AUTH_TOKEN_PEPPER: synthetic-ci-pepper-at-least-32-chars
          QDRANT_API_KEY: synthetic-ci-qdrant-key
        run: |
          docker compose -f docker-compose.yml -f docker-compose.production.yml \
            config --format json | python3 scripts/verify_production_compose.py
      - name: Build and start the full stack
        run: docker compose up -d --build --scale worker=2
      - name: Run disposable end-to-end smoke test
        shell: pwsh
        run: ./scripts/docker-smoke.ps1
      - name: Run published tutorial exercises twice and check the failure case
        run: |
          git rev-parse HEAD
          docker compose version
          python3 -u examples/tutorials/smoke_check.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
