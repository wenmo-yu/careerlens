version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # uv, not pip: backend/uv.lock is what the Docker image syncs from, so that
  # is the lockfile updates must touch.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-patch:
        applies-to: version-updates
        update-types: [patch]
    ignore:
      # These are pinned to a major on purpose; a jump needs a migration, not an
      # automatic PR that turns the quality gate red overnight.
      - dependency-name: langgraph
        update-types: [version-update:semver-major]
      - dependency-name: mcp
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      frontend-patch:
        applies-to: version-updates
        update-types: [patch]
